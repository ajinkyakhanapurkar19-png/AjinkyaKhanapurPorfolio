<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GSC · service-detail</title><style>@font-face{font-family:Inter;src:url(inter-latin.ttf) format("truetype");font-weight:100 900;font-display:swap}
:root {
  color-scheme: light;
  --font-sans: "Geist", "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --geist-background: #ffffff;
  --geist-foreground: #0a0a0a;
  --geist-muted: #666666;
  --hero-blue: #257f4c;
  --hero-blue-soft: #6fcb95;
  --hero-cloud: #eef7f1;
  --hero-max-width: 1820px;
  --peek-h: 56px;
  --peek-stagger: var(--peek-h);
  --nav-safe: 92px;
}

* { box-sizing: border-box; }

html, body { min-height: 100%; }

body {
  margin: 0;
  background: var(--geist-background);
  color: var(--geist-foreground);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
  overflow-x: hidden;
}

a { color: inherit; text-decoration: none; }

/* ===== Nav ===== */
.svc-nav {
  position: fixed;
  top: 0;
  left: 50%;
  z-index: 200;
  display: grid;
  grid-template-columns: minmax(220px, 1fr) auto minmax(180px, 1fr);
  align-items: center;
  gap: 32px;
  width: min(100% - 96px, var(--hero-max-width));
  margin: 0;
  padding: 22px 16px;
  transform: translate3d(-50%, 0, 0);
  transition: background-color 300ms ease, padding 300ms ease, box-shadow 300ms ease, border-color 300ms ease;
  border: 1px solid transparent;
  border-radius: 0;
}

.svc-nav.is-scrolled {
  margin-top: 12px;
  padding: 12px 22px;
  background-color: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-radius: 999px;
  border-color: rgba(0, 0, 0, 0.08);
  box-shadow: 0 14px 34px -12px rgba(0, 0, 0, 0.1), 0 4px 14px -6px rgba(0, 0, 0, 0.04);
}

.svc-nav__brand { display: inline-flex; align-items: center; justify-self: start; gap: 8px; min-width: 0; }

.svc-nav__name { color: #111111; font-size: 21px; font-weight: 600; line-height: 1; }

/* GSC full lockup reveal (motion system cut 1e) */
@keyframes gmGIn { from { opacity: 0; transform: scale(.93); } to { opacity: 1; transform: scale(1); } }
@keyframes gmFragL { 0% { opacity: 0; transform: rotate(-46deg); } 55% { opacity: 1; } 80% { transform: rotate(2.5deg); } 100% { opacity: 1; transform: rotate(0deg); } }
@keyframes gmFragB { 0% { opacity: 0; transform: rotate(50deg); } 55% { opacity: 1; } 80% { transform: rotate(-2.5deg); } 100% { opacity: 1; transform: rotate(0deg); } }
@keyframes gmPixel { 0% { opacity: 0; transform: scale(0); } 55% { opacity: 1; transform: scale(1.22); } 100% { opacity: 1; transform: scale(1); } }
@keyframes gmLineUp { from { transform: translateY(112%); } to { transform: translateY(0); } }

.gsc-lockup { position: relative; display: inline-block; height: var(--lockup-h, 34px); aspect-ratio: 2560 / 974; flex: 0 0 auto; }
.gsc-lockup__mark { position: absolute; left: 0; top: 0; height: 100%; width: 38.09%; }
.gsc-lockup__frag { position: absolute; inset: 0; transform-origin: 58.46% 41.07%; }
.gsc-lockup__frag img, .gsc-lockup__body, .gsc-lockup__pixel img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.gsc-lockup__frag--l { animation: gmFragL 1.3s cubic-bezier(.16,1,.3,1) .25s both; }
.gsc-lockup__frag--b { animation: gmFragB 1.4s cubic-bezier(.16,1,.3,1) .35s both; }
.gsc-lockup__body { animation: gmGIn 1s cubic-bezier(.16,1,.3,1) both; }
.gsc-lockup__pixel { position: absolute; inset: 0; transform-origin: 88% 12%; animation: gmPixel .85s cubic-bezier(.34,1.56,.64,1) .85s both; }
.gsc-lockup__word { position: absolute; overflow: hidden; }
.gsc-lockup__word img { width: 100%; height: 100%; display: block; animation: gmLineUp 1.1s cubic-bezier(.16,1,.3,1) both; }
.gsc-lockup__word--growth { left: 45.59%; top: 24.02%; width: 47.5%; height: 25.77%; }
.gsc-lockup__word--growth img { animation-delay: 1s; }
.gsc-lockup__word--supercharged { left: 39.41%; top: 60.68%; width: 59.85%; height: 23.92%; }
.gsc-lockup__word--supercharged img { animation-delay: 1.15s; }

/* GSC fueling loader (motion system cut 2e) — navbar mark only */
@keyframes gmFuel { 0% { clip-path: inset(100% 0 0 0); } 80%, 100% { clip-path: inset(0 0 0 0); } }
@keyframes gmBlink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
.gsc-lockup--fuel .gsc-lockup__mark-track,
.gsc-lockup--fuel .gsc-lockup__mark-fill { position: absolute; inset: 0; }
.gsc-lockup--fuel .gsc-lockup__mark-track img,
.gsc-lockup--fuel .gsc-lockup__mark-fill img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.gsc-lockup--fuel .gsc-lockup__mark-track { opacity: .16; }
.gsc-lockup--fuel .gsc-lockup__mark-fill { animation: gmFuel 3.4s ease-in-out infinite; }
.gsc-lockup--fuel .gsc-lockup__pixel { animation: gmBlink 3.4s ease-in-out infinite; }

/* GSC full lockup reveal, looping (footer mark only) */
.site-footer__brand:hover .gsc-lockup--loop .gsc-lockup__frag--l { animation: gmFragL 1.3s cubic-bezier(.16,1,.3,1) .25s infinite alternate; }
.site-footer__brand:hover .gsc-lockup--loop .gsc-lockup__frag--b { animation: gmFragB 1.4s cubic-bezier(.16,1,.3,1) .35s infinite alternate; }
.site-footer__brand:hover .gsc-lockup--loop .gsc-lockup__body { animation: gmGIn 1s cubic-bezier(.16,1,.3,1) infinite alternate; }
.site-footer__brand:hover .gsc-lockup--loop .gsc-lockup__pixel { animation: gmPixel .85s cubic-bezier(.34,1.56,.64,1) .85s infinite alternate; }
.site-footer__brand:hover .gsc-lockup--loop .gsc-lockup__word--growth img { animation: gmLineUp 1.1s cubic-bezier(.16,1,.3,1) 1s infinite alternate; }
.site-footer__brand:hover .gsc-lockup--loop .gsc-lockup__word--supercharged img { animation: gmLineUp 1.1s cubic-bezier(.16,1,.3,1) 1.15s infinite alternate; }

.svc-nav__links { display: flex; align-items: center; justify-content: center; gap: clamp(20px, 2.4vw, 40px); color: rgb(17 17 17 / 0.68); font-size: 14px; font-weight: 600; white-space: nowrap; }
.svc-nav__links a { transition: color 160ms ease; }
.svc-nav__links a:hover, .svc-nav__links a[aria-current="page"] { color: #111111; }

.svc-nav__cta {
  justify-self: end;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 128px;
  min-height: 44px;
  padding: 0 18px;
  border-radius: 999px;
  background: #111111;
  color: #ffffff;
  font-size: 14px;
  font-weight: 650;
  transition: background 160ms ease, transform 160ms ease;
}
.svc-nav__cta:hover { background: var(--hero-blue); transform: translateY(-1px); }

/* GSC motion system: scroll reveal + sweep-hover buttons */
[data-reveal] { opacity: 0; transform: translateY(24px); transition: opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1); }
[data-reveal].is-revealed { opacity: 1; transform: translateY(0); }

.svc-nav__cta.btn-sweep,
.service__cta.btn-sweep {
  color: #ffffff;
  background-image: linear-gradient(90deg, #257f4c 0%, #257f4c 50%, #40b970 50%, #40b970 100%);
  background-size: 220% 100%;
  background-position: 100% 0;
  transition: background-position .45s cubic-bezier(.16,1,.3,1), transform .16s ease;
}
.svc-nav__cta.btn-sweep:hover,
.service__cta.btn-sweep:hover {
  background-image: linear-gradient(90deg, #257f4c 0%, #257f4c 50%, #40b970 50%, #40b970 100%);
  background-position: 0% 0;
  color: #ffffff;
}

/* ===== Hamburger Button (inside navbar) ===== */
.svc-nav__hamburger {
  display: none;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 1px solid #D7E0DA;
  border-radius: 999px;
  background: #ffffff;
  cursor: pointer;
  z-index: 310;
  -webkit-tap-highlight-color: transparent;
  transition: border-color 0.3s ease;
}
.svc-nav__hamburger:hover { border-color: #40B970; }

.svc-nav__hamburger-lines {
  position: relative;
  width: 18px;
  height: 12px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.svc-nav__hamburger-lines span {
  display: block;
  width: 100%;
  height: 2px;
  background: #0B100E;
  border-radius: 2px;
  transition: transform 0.3s cubic-bezier(.16,1,.3,1), opacity 0.25s ease;
  transform-origin: center;
}

.svc-nav__hamburger.is-open .svc-nav__hamburger-lines span:nth-child(1) {
  transform: translateY(5px) rotate(45deg);
  background: #EDF3EF;
}
.svc-nav__hamburger.is-open .svc-nav__hamburger-lines span:nth-child(2) {
  opacity: 0;
  transform: scaleX(0);
}
.svc-nav__hamburger.is-open .svc-nav__hamburger-lines span:nth-child(3) {
  transform: translateY(-5px) rotate(-45deg);
  background: #EDF3EF;
}

/* ===== 6e Menu Overlay — dark ink takeover ===== */
.gm-menu-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  background: #0B100E;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.gm-menu-overlay.is-open {
  opacity: 1;
  pointer-events: auto;
}

.gm-menu-overlay__top {
  display: flex;
  align-items: center;
  padding: 18px 22px;
}
.gm-menu-overlay__logo {
  width: 22px;
  height: 22px;
  filter: brightness(10);
}
.gm-menu-overlay__close {
  margin-left: auto;
  cursor: pointer;
  border: 1px solid #2C3833;
  background: transparent;
  border-radius: 999px;
  width: 36px;
  height: 36px;
  font-size: 15px;
  color: #EDF3EF;
  display: grid;
  place-items: center;
  transition: border-color 0.3s ease;
}
.gm-menu-overlay__close:hover { border-color: #40B970; }

.gm-menu-overlay__links {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 13px;
  padding: 0 22px;
}
.gm-menu-overlay__link-wrap {
  overflow: hidden;
}
.gm-menu-overlay__link-wrap a {
  display: block;
  font-size: 21px;
  font-weight: 600;
  color: #EDF3EF;
  text-decoration: none;
  padding: 6px 0;
  transition: color 0.25s ease;
}
.gm-menu-overlay__link-wrap a:hover { color: #40B970; }

/* staggered rise animation — each link wrapper clips, link translates up */
.gm-menu-overlay.is-open .gm-menu-overlay__link-wrap a {
  animation: gmMenuLineUp 0.6s cubic-bezier(.16,1,.3,1) both;
}
.gm-menu-overlay.is-open .gm-menu-overlay__link-wrap:nth-child(1) a { animation-delay: 0.08s; }
.gm-menu-overlay.is-open .gm-menu-overlay__link-wrap:nth-child(2) a { animation-delay: 0.16s; }
.gm-menu-overlay.is-open .gm-menu-overlay__link-wrap:nth-child(3) a { animation-delay: 0.24s; }
.gm-menu-overlay.is-open .gm-menu-overlay__link-wrap:nth-child(4) a { animation-delay: 0.32s; }
.gm-menu-overlay.is-open .gm-menu-overlay__link-wrap:nth-child(5) a { animation-delay: 0.40s; }

@keyframes gmMenuLineUp {
  from { transform: translateY(100%); }
  to   { transform: translateY(0); }
}
@keyframes gmFade {
  from { opacity: 0; }
  to   { opacity: 1; }
}

.gm-menu-overlay__cta {
  padding: 0 22px 34px;
  animation: gmFade 0.5s ease 0.5s both;
}
.gm-menu-overlay__cta a {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 600;
  color: #40B970;
  text-decoration: none;
  transition: color 0.25s ease;
}
.gm-menu-overlay__cta a:hover { color: #5CD68A; }

@media (max-width: 1180px) {
  .svc-nav {
    grid-template-columns: auto 1fr auto;
    width: min(100% - 48px, var(--hero-max-width));
  }
  .svc-nav__links { gap: 20px; font-size: 14px; }
}

@media (max-width: 860px) {
  .svc-nav { grid-template-columns: 1fr auto; padding-top: 22px; }
  .svc-nav__links { display: none; }
  .svc-nav__cta { display: none; }
  .svc-nav__hamburger { display: flex; }
}

@media (max-width: 560px) {
  .svc-nav { width: min(100% - 32px, var(--hero-max-width)); gap: 16px; }
  .svc-nav__cta { min-width: auto; min-height: 38px; padding: 0 12px; font-size: 13px; }
}

/* ===== Intro ===== */
.svc-intro {
  position: relative;
  z-index: 5;
  overflow: hidden;
  min-height: 100vh;
  padding: clamp(150px, 20vw, 220px) clamp(16px, 3.8vw, 72px) clamp(56px, 6vw, 96px);
}

.svc-intro__cubes {
  position: absolute;
  inset: 0;
  z-index: 0;
  width: 100%;
  height: 100%;
  display: block;
  background: #808080;
}



.svc-intro__eyebrow {
  position: relative;
  z-index: 2;
  display: block;
  margin: 0 0 clamp(18px, 2vw, 28px);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgb(20 34 34 / 0.48);
}

.svc-intro h1 {
  position: relative;
  z-index: 2;
  margin: 0;
  max-width: 920px;
  font-size: clamp(40px, 5.4vw, 88px);
  font-weight: 260;
  letter-spacing: -0.01em;
  line-height: 1.04;
  color: #111111;
}

.svc-intro p {
  position: relative;
  z-index: 2;
  max-width: 620px;
  margin: clamp(20px, 2.4vw, 32px) 0 0;
  font-size: clamp(16px, 1.2vw, 20px);
  font-weight: 400;
  line-height: 1.6;
  color: #5f5f5f;
}

/* ===== Services stack — one fixed-camera 3D scene ===== */
.services-stack {
  --n-services: 8;
  --stack-travel: 46vh;
  position: relative;
  background: #ffffff;
  height: calc(100vh + var(--n-services) * var(--stack-travel));
}

.stack-stage {
  position: sticky;
  top: 0;
  height: 100vh;
  overflow: hidden;
  overflow: clip;
  perspective: 2000px;
  perspective-origin: 50% 48%;
  transform-style: preserve-3d;
}

.stack-world {
  position: absolute;
  top: clamp(68px, 7vh, 96px);
  right: 0;
  bottom: auto;
  left: 0;
  height: 100%;
  transform-style: preserve-3d;
  transform-origin: 50% 50%;
  will-change: transform;
}

.service {
  position: absolute;
  inset: 0;
  z-index: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 clamp(16px, 3.8vw, 72px);
  pointer-events: none;
  transform-origin: 50% 50%;
  transform-style: preserve-3d;
  backface-visibility: hidden;
  opacity: 0;
  will-change: transform, opacity;
}

.service:first-child { opacity: 1; }
.service.is-front { pointer-events: auto; }

.stack-stage .service__card {
  flex: 0 0 auto;
  width: min(100%, 1180px);
  height: min(68vh, 700px);
  margin: 0;
}

@media (prefers-reduced-motion: reduce) {
  .services-stack { height: auto; }
  .stack-stage { position: static; height: auto; overflow: visible; perspective: none; }
  .stack-world { position: static; transform: none !important; }
  .service { position: relative; inset: auto; align-items: stretch; padding: 0 0 28px; pointer-events: auto; opacity: 1 !important; }
  .stack-stage .service__card { height: auto; flex: 1 1 auto; margin: 0 auto 40px; }
}

.service__card {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  max-width: 1360px;
  margin: 12px auto 40px;
  display: flex;
  flex-direction: column;
  background: var(--card-bg, #dce6f7);
  border: 1px solid rgb(18 35 35 / 0.09);
  border-radius: 28px;
  box-shadow: 0 30px 80px rgb(21 34 34 / 0.12);
  overflow: hidden;
  transform-origin: 50% 100%;
  will-change: transform, opacity;
  backface-visibility: hidden;
}

.service__header {
  position: relative;
  z-index: 1;
  flex: 0 0 auto;
  display: flex;
  align-items: baseline;
  gap: clamp(16px, 2vw, 28px);
  padding: clamp(14px, 1.7vw, 22px) clamp(24px, 3vw, 48px);
  border-bottom: 1px solid rgb(18 35 35 / 0.1);
}

.service__num { font-family: var(--font-mono); font-size: clamp(13px, 1vw, 15px); font-weight: 700; letter-spacing: 0.06em; color: rgb(255 255 255 / 0.7); }
.service__heading { margin: 0; font-size: clamp(20px, 2.2vw, 32px); font-weight: 560; letter-spacing: -0.01em; color: #ffffff; }

.service--dark .service__header { border-bottom-color: rgb(255 255 255 / 0.14); }
.service--dark .service__num { color: rgb(255 255 255 / 0.7); }
.service--dark .service__heading { color: #ffffff; }

.service__body {
  position: relative;
  z-index: 1;
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  grid-template-columns: 1fr;
  gap: clamp(20px, 3vw, 56px);
  padding: clamp(18px, 2.6vw, 40px);
  overflow: hidden;
}

.service__copy { display: flex; flex-direction: column; justify-content: center; gap: clamp(10px, 1.4vw, 18px); min-width: 0; max-width: 640px; }

.service--media .service__body {
  position: relative;
  background-image: var(--card-media, url("mrsbtvia-business-team-working-new-business-plan-with-modern-digital-computer-top-view-shot.webp"));
  background-size: cover;
  background-position: center;
}
.service--media .service__body::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  background: linear-gradient(100deg, rgb(10 20 15 / 0.9) 0%, rgb(10 20 15 / 0.68) 42%, rgb(10 20 15 / 0.22) 78%, rgb(10 20 15 / 0.08) 100%);
}
.service--media .service__copy { position: relative; z-index: 1; }
.service--media .service__intro { color: rgb(255 255 255 / 0.92); }
.service--media .service__deliver-label { color: rgb(255 255 255 / 0.66); }
.service--media .service__deliver li { color: #ffffff; }
.service--media .service__deliver li::before { background: #ffffff; }
.service__intro { margin: 0; max-width: 46ch; font-size: clamp(15px, 1.1vw, 18px); line-height: 1.62; color: rgb(17 24 39 / 0.72); }

.service__deliver-label { display: block; margin: 0 0 10px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: rgb(17 24 39 / 0.5); }
.service__deliver ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 20px; }
.service__deliver li { position: relative; padding-left: 16px; font-size: 13.5px; font-weight: 620; line-height: 1.3; color: #1f2937; }
.service__deliver li::before { content: ""; position: absolute; left: 0; top: 7px; width: 6px; height: 6px; border-radius: 50%; background: #2b3a63; }

.service--dark .service__intro { color: rgb(255 255 255 / 0.88); }
.service--dark .service__deliver-label { color: rgb(255 255 255 / 0.56); }
.service--dark .service__deliver li { color: #ffffff; }
.service--dark .service__deliver li::before { background: #ffffff; }

.service__cta {
  align-self: flex-start;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
  padding: 12px 22px;
  border-radius: 999px;
  background: #111111;
  color: #ffffff;
  font-size: 13.5px;
  font-weight: 700;
  transition: background 160ms ease, transform 160ms ease;
}
.service__cta:not(.btn-sweep):hover { background: #ffffff; color: #111111; transform: translateY(-1px); }
.service__cta .ph { font-size: 15px; }

@media (max-width: 760px) {
  :root { --peek-h: 52px; --peek-stagger: 36px; }
  .service { padding: 0 20px; }
  .stack-world { top: clamp(58px, 7vh, 72px); }
  .stack-stage .service__card { height: min(64vh, 560px); }
  .service__header { flex-direction: row; align-items: baseline; gap: 8px; padding: 10px 20px; }
  .service__num { font-size: 10px; }
  .service__heading { font-size: 14px; }
  .service__body { padding: 20px; gap: 16px; overflow-y: auto; }
  .service__intro { font-size: 14px; line-height: 1.55; }
  .service__deliver ul { grid-template-columns: 1fr; }
  .service__cta { margin-top: auto; margin-bottom: 16px; }
  .svc-intro {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px clamp(16px, 3.8vw, 72px) clamp(40px, 5vw, 60px);
    text-align: center;
  }
  .svc-intro p { max-width: 100%; }
}

/* ===== Closing CTA (motion system cut 8a — telescope dive) ===== */
.svc-closing {
  position: relative;
  z-index: 300;
  height: 50vh;
  background: #ffffff;
  color: #153b28;
}

.svc-closing__viewport {
  position: sticky;
  top: 0;
  width: 100%;
  height: 50vh;
  overflow: hidden;
  background: #ffffff;
  isolation: isolate;
}

.svc-closing__viewport::before {
  content: "";
  position: absolute;
  inset: 0 0 auto;
  z-index: 3;
  height: clamp(280px, 54vh, 640px);
  background: linear-gradient(
    180deg,
    #ffffff 0%,
    rgb(255 255 255 / 0.995) 12%,
    rgb(255 255 255 / 0.92) 28%,
    rgb(255 255 255 / 0.7) 48%,
    rgb(255 255 255 / 0.38) 70%,
    rgb(255 255 255 / 0.1) 90%,
    rgb(255 255 255 / 0) 100%
  );
  filter: blur(24px);
  transform: translateY(-34px) scaleX(1.1);
  pointer-events: none;
}

.svc-closing__bg {
  display: none;
}

.svc-closing__bg-video {
  position: absolute;
  inset: 0;
  z-index: 0;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  background: #ffffff;
}

.svc-closing__bg-overlay {
  position: absolute;
  inset: 0;
  z-index: 1;
  overflow: hidden;
  background: linear-gradient(180deg, rgb(255 255 255 / 0.1), rgb(255 255 255 / 0.03));
  isolation: isolate;
}

.svc-closing__blob {
  position: absolute;
  z-index: 0;
  display: block;
  width: clamp(360px, 52vw, 900px);
  aspect-ratio: 1.22;
  border-radius: 57% 43% 68% 32% / 46% 62% 38% 54%;
  filter: blur(68px);
  opacity: 0.52;
  pointer-events: none;
  will-change: transform, border-radius;
}

.svc-closing__blob--one {
  top: -72%;
  left: -18%;
  background: radial-gradient(circle at 42% 48%, rgb(37 127 76 / 0.72) 0%, rgb(64 185 112 / 0.38) 42%, transparent 74%);
  animation: svc-closing-blob-drift-one 36s ease-in-out infinite alternate;
}

.svc-closing__blob--two {
  right: -18%;
  bottom: -76%;
  width: clamp(420px, 60vw, 1040px);
  opacity: 0.42;
  border-radius: 39% 61% 44% 56% / 63% 42% 58% 37%;
  background: radial-gradient(circle at 50% 42%, rgb(170 235 193 / 0.8) 0%, rgb(111 203 149 / 0.38) 44%, transparent 75%);
  animation: svc-closing-blob-drift-two 44s ease-in-out infinite alternate;
}

.svc-closing__blob--three {
  top: 8%;
  right: 18%;
  width: clamp(250px, 32vw, 560px);
  opacity: 0.3;
  border-radius: 63% 37% 52% 48% / 39% 58% 42% 61%;
  background: radial-gradient(circle at 48% 48%, rgb(201 247 215 / 0.78) 0%, rgb(93 182 125 / 0.26) 47%, transparent 76%);
  animation: svc-closing-blob-drift-three 30s ease-in-out infinite alternate;
}

.svc-closing__blob--four {
  top: 26%;
  left: 34%;
  width: clamp(300px, 40vw, 700px);
  opacity: 0.24;
  border-radius: 46% 54% 35% 65% / 62% 39% 61% 38%;
  background: radial-gradient(circle at 52% 48%, rgb(16 105 61 / 0.52) 0%, rgb(132 211 157 / 0.2) 44%, transparent 77%);
  animation: svc-closing-blob-drift-four 40s ease-in-out infinite alternate;
}

@keyframes svc-closing-blob-drift-one {
  0% { transform: translate3d(calc(-5% + var(--parallax-x, 0px)), calc(-4% + var(--parallax-y, 0px)), 0) rotate(-12deg) scale(.9); border-radius: 57% 43% 68% 32% / 46% 62% 38% 54%; }
  50% { border-radius: 35% 65% 47% 53% / 60% 34% 66% 40%; }
  100% { transform: translate3d(calc(22% + var(--parallax-x, 0px)), calc(19% + var(--parallax-y, 0px)), 0) rotate(14deg) scale(1.12); border-radius: 64% 36% 39% 61% / 38% 63% 37% 62%; }
}

@keyframes svc-closing-blob-drift-two {
  0% { transform: translate3d(calc(6% + var(--parallax-x, 0px)), calc(5% + var(--parallax-y, 0px)), 0) rotate(10deg) scale(1.06); border-radius: 39% 61% 44% 56% / 63% 42% 58% 37%; }
  50% { border-radius: 58% 42% 67% 33% / 39% 65% 35% 61%; }
  100% { transform: translate3d(calc(-20% + var(--parallax-x, 0px)), calc(-18% + var(--parallax-y, 0px)), 0) rotate(-13deg) scale(.9); border-radius: 31% 69% 52% 48% / 68% 38% 62% 32%; }
}

@keyframes svc-closing-blob-drift-three {
  0% { transform: translate3d(calc(-28% + var(--parallax-x, 0px)), calc(8% + var(--parallax-y, 0px)), 0) rotate(-18deg) scale(.86); border-radius: 63% 37% 52% 48% / 39% 58% 42% 61%; }
  50% { border-radius: 43% 57% 62% 38% / 57% 42% 58% 43%; }
  100% { transform: translate3d(calc(30% + var(--parallax-x, 0px)), calc(-14% + var(--parallax-y, 0px)), 0) rotate(18deg) scale(1.16); border-radius: 29% 71% 44% 56% / 67% 35% 65% 33%; }
}

@keyframes svc-closing-blob-drift-four {
  0% { transform: translate3d(calc(-10% + var(--parallax-x, 0px)), calc(12% + var(--parallax-y, 0px)), 0) rotate(7deg) scale(.92); border-radius: 46% 54% 35% 65% / 62% 39% 61% 38%; }
  50% { border-radius: 66% 34% 55% 45% / 42% 63% 37% 58%; }
  100% { transform: translate3d(calc(16% + var(--parallax-x, 0px)), calc(-12% + var(--parallax-y, 0px)), 0) rotate(-11deg) scale(1.08); border-radius: 34% 66% 43% 57% / 58% 36% 64% 42%; }
}

@media (prefers-reduced-motion: reduce) {
  .svc-closing__blob { animation: none; }
}

.svc-closing__dive {
  position: absolute;
  inset: 0;
  z-index: 4;
  display: flex;
  align-items: center;
  justify-content: center;
}

.svc-closing__stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(16px, 2vw, 28px);
  width: min(880px, 90vw);
  padding: clamp(26px, 3.8vw, 48px) clamp(22px, 3.4vw, 44px);
  text-align: center;
  transform: scale(0.3);
  opacity: 0.4;
  will-change: transform, opacity;
}

.svc-closing h2 {
  max-width: 760px;
  margin: 0;
  font-size: clamp(34px, 4.6vw, 62px);
  font-weight: 620;
  letter-spacing: -0.015em;
  line-height: 1.1;
  color: #123d28;
  text-shadow: none;
}

.svc-closing p { max-width: 600px; margin: 0; font-size: clamp(16px, 1.3vw, 20px); font-weight: 500; line-height: 1.58; color: rgb(21 59 40 / 0.72); text-shadow: none; }

.svc-closing__cta {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-top: clamp(8px, 1vw, 16px);
  padding: 16px 32px;
  border-radius: 999px;
  background: #257f4c;
  color: #ffffff;
  font-size: 17px;
  font-weight: 700;
  transition: background 160ms ease, transform 160ms ease;
}
.svc-closing__cta:hover { background: #153b28; color: #ffffff; transform: translateY(-1px); }

/* ===== Footer (shared with index.html) ===== */
.site-footer { position: relative; z-index: 100; overflow: hidden; background: #000000; color: #ffffff; }

.site-footer__inner { width: min(100% - 96px, var(--hero-max-width)); margin: 0 auto; padding: clamp(22px, 2.6vw, 36px) 0 clamp(14px, 1.4vw, 22px); }

.site-footer__top {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: clamp(20px, 3vw, 48px);
  width: 100%;
}

.site-footer__top h2 { max-width: 680px; margin: 0; color: #ffffff; font-size: clamp(34px, 3.5vw, 62px); font-weight: 220; letter-spacing: 0; line-height: 1.06; }

.site-footer__description {
  justify-self: start;
  max-width: 320px;
  margin: 0;
  color: rgb(255 255 255 / 0.6);
  font-size: 16px;
  font-weight: 400;
  line-height: 1.55;
  text-align: left;
}

.site-footer__nav { display: flex; flex-direction: column; align-items: flex-start; gap: clamp(14px, 1.35vw, 22px); }
.site-footer__nav a { color: rgb(255 255 255 / 0.88); font-size: 16px; font-weight: 650; line-height: 1.1; transition: color 180ms ease, transform 180ms ease; }
.site-footer__nav a:hover { color: #ffffff; transform: translateX(3px); }

.site-footer__contact-heading { color: #ffffff; font-size: 16px; font-weight: 700; line-height: 1.1; }
.site-footer__contact-label { margin-top: -10px; color: rgb(255 255 255 / 0.48); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }

.site-footer__contact-form { display: flex; align-items: center; gap: 6px; width: 100%; max-width: 220px; padding: 6px; border-radius: 999px; background: rgb(255 255 255 / 0.08); }
.site-footer__contact-form input { flex: 1 1 auto; min-width: 0; padding: 8px 4px 8px 10px; border: 0; background: transparent; color: #ffffff; font-size: 13px; font-family: inherit; }
.site-footer__contact-form input::placeholder { color: rgb(255 255 255 / 0.4); }
.site-footer__contact-form input:focus { outline: none; }
.site-footer__contact-form button { flex: 0 0 auto; display: inline-grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 50%; background: var(--hero-blue); color: #ffffff; cursor: pointer; }
.site-footer__contact-form button .ph { font-size: 14px; }

.site-footer__brand { display: flex; align-items: center; justify-content: flex-end; justify-self: end; flex: 0 0 auto; min-width: 0; color: #ffffff; }
.site-footer__mark { position: relative; flex: 0 0 clamp(58px, 6.1vw, 118px); aspect-ratio: 1; margin-right: clamp(14px, 1.6vw, 28px); overflow: hidden; border-radius: 50%; background: #ffffff; }
.site-footer__mark::before {
  content: "";
  position: absolute;
  inset: -18%;
  background: #000000;
  clip-path: polygon(0 20%, 100% 8%, 100% 19%, 0 31%, 0 43%, 100% 31%, 100% 42%, 0 54%, 0 66%, 100% 54%, 100% 65%, 0 77%);
}
.site-footer__brand span:last-child { display: block; flex: 1 1 auto; min-width: 0; font-size: clamp(58px, 11.1vw, 214px); font-weight: 760; letter-spacing: -0.055em; line-height: 0.78; white-space: nowrap; }
.site-footer__brand .gsc-lockup { display: inline-block !important; flex: 0 0 auto !important; width: auto !important; font-size: initial !important; letter-spacing: normal !important; line-height: normal !important; white-space: normal !important; }

.site-footer__contact-corner { display: flex; flex-direction: column; align-items: center; text-align: center; justify-self: center; }

@media (max-width: 980px) {
  .site-footer__inner { width: min(100% - 48px, var(--hero-max-width)); }
}

@media (max-width: 560px) {
  .site-footer__inner { width: min(100% - 32px, var(--hero-max-width)); }
  .site-footer__top { grid-template-columns: 1fr; }
  .site-footer__description, .site-footer__brand { justify-self: center; text-align: center; }
  .site-footer__nav a { font-size: 15px; }
  .site-footer__mark { flex-basis: clamp(38px, 12vw, 58px); }
  .site-footer__brand span:last-child { font-size: clamp(45px, 18vw, 84px); }
  .site-footer__brand .gsc-lockup { height: 38px !important; }
}

  

/* Keep the expanded website navigation clear at compact widths. */
@media (max-width: 1100px) {
  .svc-nav { grid-template-columns: 1fr auto; }
  .svc-nav__links, .svc-nav__cta { display: none; }
  .svc-nav__hamburger { display: flex; }
}
.gm-menu-overlay { overflow-y: auto; }
.gm-menu-overlay__link-wrap a { min-height: 44px; display: flex; align-items: center; }
